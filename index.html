<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#19502F" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-UeM.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
    <meta name="description" content="U&M MINERAÇÃO - RELATÓRIO DE MANUTENÇÃO. Sistema moderno, rápido e fácil de monitoramento de frentes e pendências." />
    <meta property="og:title" content="U&M - Relatório de Manutenção" />
    <meta property="og:description" content="U&M MINERAÇÃO - RELATÓRIO DE MANUTENÇÃO. Sistema moderno, rápido e fácil de monitoramento de frentes e pendências." />
    <title>U&M MINERAÇÃO - RELATÓRIO DE MANUTENÇÃO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registrado!', reg.scope);
            })
            .catch((err) => {
              console.error('[PWA] Falha no Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
