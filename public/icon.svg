<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="icon-text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="3" floodColor="#001206" floodOpacity="0.6"/>
    </filter>
  </defs>

  <!-- Clean dark green background gradient slightly rounded -->
  <rect width="512" height="512" fill="#004d2c" rx="128" />
  
  <!-- Sleek silver external outline tracing the rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#c0c0c0" stroke-width="12" />

  <!-- Inner exquisite white contour line -->
  <rect x="42" y="42" width="428" height="428" rx="86" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9" />

  <g transform="translate(10, 48)">
    <!-- Crisp white 'U', same color as the original design -->
    <text 
      x="75" 
      y="262" 
      font-family="'Inter', 'Arial Black', 'Impact', sans-serif" 
      font-size="180" 
      font-weight="900" 
      fill="#ffffff" 
      filter="url(#icon-text-shadow)"
      letter-spacing="-4"
    >
      U
    </text>
    
    <!-- Crisp white '&' in the center, same color as U and M! -->
    <text 
      x="246" 
      y="262" 
      text-anchor="middle"
      font-family="'Inter', 'Arial Black', sans-serif" 
      font-size="150" 
      font-weight="900" 
      fill="#ffffff" 
      filter="url(#icon-text-shadow)"
    >
      &amp;
    </text>
    
    <!-- Crisp white 'M', same color as the other elements -->
    <text 
      x="315" 
      y="262" 
      font-family="'Inter', 'Arial Black', 'Impact', sans-serif" 
      font-size="180" 
      font-weight="900" 
      fill="#ffffff" 
      filter="url(#icon-text-shadow)"
      letter-spacing="-4"
    >
      M
    </text>
  </g>
</svg>
